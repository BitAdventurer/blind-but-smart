<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">Blind but Smart: joint control with a released visual interface</title>
  <desc id="overview-description">A trusted client checks budget admission before accessing a recorded screen. The admitted screen supplies twenty-five clipped regional features of dimension 256. A private probe informs joint regional-budget and candidate-count control. An affordability filter selects an executable refinement, which randomizes trusted features. Only the completed release, public instruction, and candidate-count decision reach a frozen Qwen executor. Multiple candidates share that one release. A weighted sampled medoid selects an output and returns post-processing feedback for the next slot. Clean features and probe values remain on the trusted client. Failed admission produces a padding slot without screen access.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24445e"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172f46; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #576a7b; }
      .panel-title { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
      .box-title { font-size: 18px; font-weight: 700; }
      .box-copy { font-size: 15px; fill: #465c6f; }
      .small { font-size: 13px; fill: #576a7b; }
      .teal-copy { fill: #087f8c; }
      .block { fill: #ffffff; stroke: #b8c9d6; stroke-width: 1.5; }
      .accent { fill: #eaf7f7; stroke: #087f8c; stroke-width: 1.8; }
      .flow { fill: none; stroke: #24445e; stroke-width: 2; marker-end: url(#arrow-navy); }
      .protected-flow { fill: none; stroke: #087f8c; stroke-width: 2.5; marker-end: url(#arrow-teal); }
      .feedback { fill: none; stroke: #087f8c; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="24" y="34" class="title">Joint control with a released visual interface</text>
  <text x="24" y="58" class="subtitle">Recorded GUI grounding · current reference runtime</text>

  <rect x="24" y="82" width="744" height="410" rx="16" fill="#f7fafc" stroke="#d7e2ea"/>
  <rect x="804" y="82" width="372" height="410" rx="16" fill="#f5fbfb" stroke="#bcdcdc"/>
  <text x="44" y="112" class="panel-title">TRUSTED CLIENT</text>
  <text x="824" y="112" class="panel-title">EXECUTOR</text>

  <!-- Admission is upstream of every current-screen read. -->
  <rect x="44" y="158" width="174" height="82" rx="10" class="block"/>
  <text x="131" y="189" text-anchor="middle" class="box-title">Admission check</text>
  <text x="131" y="215" text-anchor="middle" class="box-copy">Before screen access</text>
  <path d="M 218 199 H 251" class="flow"/>

  <rect x="252" y="158" width="210" height="82" rx="10" class="block"/>
  <text x="357" y="187" text-anchor="middle" class="box-title">Regional features</text>
  <text x="357" y="211" text-anchor="middle" class="box-copy">25 × 256 · unit clipping</text>
  <text x="357" y="143" text-anchor="middle" class="small">Recorded screen</text>

  <!-- Clean features have a trusted-side path to refinement only. -->
  <path d="M 462 199 H 519" class="flow"/>
  <path d="M 357 240 V 312" class="flow"/>

  <rect x="252" y="313" width="210" height="82" rx="10" class="accent"/>
  <text x="357" y="344" text-anchor="middle" class="box-title">Private probe</text>
  <text x="357" y="370" text-anchor="middle" class="box-copy">Protected allocation signal</text>
  <path d="M 462 354 H 519" class="protected-flow"/>

  <rect x="520" y="313" width="224" height="82" rx="10" class="accent"/>
  <text x="632" y="342" text-anchor="middle" class="box-title">Joint controller</text>
  <text x="632" y="366" text-anchor="middle" class="box-copy">Regional budgets + count k</text>
  <path d="M 632 313 V 241" class="protected-flow"/>
  <text x="646" y="274" class="small teal-copy">Budget proposal</text>

  <rect x="520" y="158" width="224" height="82" rx="10" class="accent"/>
  <text x="632" y="185" text-anchor="middle" class="box-title">Filter + refinement</text>
  <text x="632" y="209" text-anchor="middle" class="box-copy">Affordable release</text>
  <text x="632" y="141" text-anchor="middle" class="small">Proposal or fixed fallback</text>

  <!-- Only the completed release crosses the visual boundary. -->
  <path d="M 744 199 H 827" class="protected-flow"/>
  <text x="786" y="168" text-anchor="middle" class="small teal-copy">Release</text>
  <text x="786" y="184" text-anchor="middle" class="small teal-copy">+ count k</text>

  <path d="M 131 240 V 312" class="flow" stroke-dasharray="5 5"/>
  <text x="142" y="279" class="small">Not admitted</text>
  <rect x="44" y="313" width="174" height="82" rx="10" fill="#f0f4f7" stroke="#c7d4de"/>
  <text x="131" y="344" text-anchor="middle" class="box-title">Padding slot</text>
  <text x="131" y="370" text-anchor="middle" class="box-copy">No screen access</text>

  <text x="992" y="143" text-anchor="middle" class="small">Public instruction</text>
  <path d="M 992 147 V 157" class="flow"/>
  <rect x="828" y="158" width="328" height="82" rx="10" class="block"/>
  <text x="992" y="189" text-anchor="middle" class="box-title">Frozen Qwen executor</text>
  <text x="992" y="215" text-anchor="middle" class="box-copy">Released visual tokens + instruction</text>
  <path d="M 992 240 V 280" class="flow"/>

  <rect x="828" y="281" width="328" height="70" rx="10" class="block"/>
  <text x="992" y="309" text-anchor="middle" class="box-title">k candidate outputs</text>
  <text x="992" y="333" text-anchor="middle" class="box-copy">All share one completed release</text>
  <path d="M 992 351 V 388" class="flow"/>

  <rect x="828" y="389" width="328" height="70" rx="10" class="accent"/>
  <text x="992" y="417" text-anchor="middle" class="box-title">Weighted sampled medoid</text>
  <text x="992" y="441" text-anchor="middle" class="box-copy">Select one candidate coordinate</text>

  <path d="M 828 424 H 632 V 396" class="feedback"/>
  <text x="719" y="446" text-anchor="middle" class="small teal-copy">Feedback for next slot</text>
  <text x="44" y="469" class="small">Clean features and probe values remain on the trusted client.</text>
  <text x="24" y="521" class="subtitle">One completed visual release per invocation; candidate generation and selection reuse it.</text>
</svg>
